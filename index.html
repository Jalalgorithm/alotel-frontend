<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Tab icon: SVG for modern browsers, PNG fallback for Safari/older -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#12603F" />
    <meta
      name="description"
      content="Alotel Spaces — verified luxury residences and extended-stay accommodation across the world's most desirable destinations."
    />

    <!-- Display + UI typefaces used across the Figma designs -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,500;1,600;1,700&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Alotel Spaces — Premium Stays, Professionally Managed</title>

    <!--
      Usercentrics cookie consent (supplied by Termageddon).

      Loaded here rather than from a component because the banner has to appear
      before React mounts — consent is asked for on arrival, not after the app
      has already run. `uc-block.bundle.js` is Usercentrics' Smart Data
      Protector: it holds back third-party scripts until the visitor consents.

      Note for anyone debugging a missing Stripe modal or map: that blocking is
      the point, and a visitor who has declined will see those features stay
      inert until they change their answer through Privacy Settings in the
      footer.
    -->
    <link rel="preconnect" href="//privacy-proxy.usercentrics.eu" />
    <link rel="preload" href="//privacy-proxy.usercentrics.eu/latest/uc-block.bundle.js" as="script" />
    <script type="application/javascript" src="https://privacy-proxy.usercentrics.eu/latest/uc-block.bundle.js"></script>
    <!--
      `bundle.js`, not `loader.js`. Usercentrics' loader fetches part of itself
      as a blob and evaluates it, which a Content-Security-Policy can only
      permit by allowing 'unsafe-eval' and blob: scripts for the whole site —
      the two allowances that would undo most of the policy. Their own guidance
      is to use the bundle when a CSP is in force.
    -->
    <script
      id="usercentrics-cmp"
      src="https://app.usercentrics.eu/browser-ui/latest/bundle.js"
      data-settings-id="U7jSXkZMXkDPaX"
      async
    ></script>
    <!-- Was inline; moved to a file so the CSP needs no `unsafe-inline`. -->
    <script src="/uc-translations.js" defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
